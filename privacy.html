<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Política de Privacidad – Cabrero / DondeCabrero</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="index.html"><img src="imagine_images/Z5g5p.jpg" alt="Cabrero / DondeCabrero" class="logo"></a>
      <div class="lang-switch">
        <button data-lang="es" class="active">ES</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <div class="legal">
    <a href="index.html" data-i18n="back">← Volver</a>
    <h1 id="privacy-title">Política de Privacidad</h1>
    <div id="privacy-content"></div>
    <p class="note">Última actualización: 26 de noviembre de 2026</p>
  </div>

  <script src="script.js"></script>
  <script>
    const privacy = {
      es: `
        <h2>Qué información guardamos</h2>
        <p>Solo guardamos tu ubicación si tú nos das permiso. Es para que los cabreros y las personas que quieren leche se encuentren más fácil.</p>
        <ul>
          <li><strong>Si eres cabrero:</strong> cuando estás vendiendo leche, recordamos por dónde pasas. Tú decides cuánto queremos recordar. Después de unos días se borra solo. También puedes borrar todo cuando quieras o decir “hoy no quiero que me sigan”.</li>
          <li><strong>Si quieres comprar leche:</strong> puedes elegir si mostramos más o menos dónde estás (solo un círculo grande, no tu casa exacta) para que los cabreros sepan que hay alguien cerca. Esa información se borra rápido. También puedes usar la app sin que guardemos nada de ti.</li>
        </ul>
        <p>Si entras sin crear cuenta, no pedimos tu nombre ni correo. Solo usamos un número secreto temporal para que la app funcione mientras la tengas abierta.</p>

        <h2>Para qué usamos esa información</h2>
        <p>Solo para ayudarte a encontrar leche fresca cerca o para que los cabreros sepan que hay alguien que quiere comprar. No vendemos tu información a nadie. No se la damos a otras empresas.</p>
        <p>A veces podemos mostrar anuncios de gente de aquí (como tiendas de comida para cabras o cosas saludables). Esos anuncios no te siguen a otras páginas.</p>

        <h2>Cuánto tiempo la guardamos</h2>
        <p>La información de los cabreros se queda solo unos días y luego se borra. La de las personas que quieren leche se borra casi de inmediato o cuando cierras la app. Tú controlas todo.</p>

        <h2>Tus derechos</h2>
        <p>Puedes decir “sí” o “no” a la ubicación cuando quieras. Puedes borrar lo que guardamos. Puedes dejar de usar la app en cualquier momento.</p>

        <h2>Contacto</h2>
        <p>Si tienes preguntas: WhatsApp +502 3369-5266 (Cabrero App).</p>
      `,
      en: `
        <h2>What information we keep</h2>
        <p>We only keep your location if you say it’s okay. We do it so shepherds and people who want milk can find each other more easily.</p>
        <ul>
          <li><strong>If you are a shepherd:</strong> when you are selling milk, we remember the path you take. You choose how much we remember. After a few days it disappears by itself. You can also erase everything anytime or say “don’t follow me today”.</li>
          <li><strong>If you want to buy milk:</strong> you can choose whether we show roughly where you are (just a big circle, not your exact house) so shepherds know someone nearby wants milk. That information goes away quickly. You can also use the app without us keeping anything about you.</li>
        </ul>
        <p>If you use the app without making an account, we don’t ask for your name or email. We just use a temporary secret number so the app works while you have it open.</p>

        <h2>What we use the information for</h2>
        <p>Only to help you find fresh milk nearby or to let shepherds know someone wants to buy. We never sell your information. We don’t give it to other companies.</p>
        <p>Sometimes we may show ads from local people (like goat food stores or healthy things). Those ads don’t follow you to other websites.</p>

        <h2>How long we keep it</h2>
        <p>Shepherd information stays only a few days and then disappears. Information about people who want milk disappears almost right away or when you close the app. You are always in control.</p>

        <h2>Your rights</h2>
        <p>You can say yes or no to location anytime. You can erase what we saved. You can stop using the app whenever you want.</p>

        <h2>Contact</h2>
        <p>If you have questions: WhatsApp +502 3369-5266 (Cabrero App).</p>
      `
    };
    function updatePrivacy(lang) {
      lang = lang || localStorage.getItem('dondecabreo-lang') || 'es';
      document.getElementById('privacy-title').textContent = lang === 'es' ? 'Política de Privacidad' : 'Privacy Policy';
      document.getElementById('privacy-content').innerHTML = privacy[lang];
    }
    window.onLangChange = updatePrivacy;
    document.addEventListener('DOMContentLoaded', () => updatePrivacy());
  </script>
</body>
</html>
