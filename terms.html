<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Términos de Uso – Cabrero / DondeCabrero</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="index.html"><img src="imagine_images/Z5g5p.jpg" alt="Cabrero / DondeCabrero" class="logo"></a>
      <div class="lang-switch">
        <button data-lang="es" class="active">ES</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <div class="legal">
    <a href="index.html" data-i18n="back">← Volver</a>
    <h1 id="terms-title">Términos de Uso</h1>
    <div id="terms-content"></div>
    <p class="note">Última actualización: 26 de noviembre de 2026</p>
  </div>

  <script src="script.js"></script>
  <script>
    const terms = {
      es: `
        <h2>Al usar la app aceptas esto</h2>
        <p>Cuando usas la App Cabrero (para los pastores) o la App DondeCabrero (para las personas que quieren leche), estás de acuerdo con estas reglas simples.</p>

        <h2>Para qué sirve</h2>
        <p>La app ayuda a que los cabreros que venden leche de cabra fresca y las personas que la quieren comprar se encuentren en Ciudad de Guatemala y cerca. Los cabreros pueden mostrar por dónde van cuando están vendiendo. Las personas que quieren leche pueden ver si hay alguien cerca.</p>
        <p>Puedes usar la app sin crear una cuenta (como invitado) o con tu cuenta de Google o correo.</p>

        <h2>Sobre la ubicación</h2>
        <ul>
          <li>Solo usamos tu ubicación si tú lo permites.</li>
          <li>Los cabreros eligen cuánto quieren que recordemos de su camino. Se borra después de unos días.</li>
          <li>Las personas que quieren leche pueden elegir si mostramos más o menos dónde están. Esa información se borra rápido.</li>
          <li>No prometemos que siempre vas a encontrar leche o que el cabrero va a estar exactamente donde dice.</li>
        </ul>

        <h2>Cosas importantes</h2>
        <p>La app se da “como está”. Nosotros no vendemos la leche. La compra es entre tú y el cabrero. Úsala con cuidado. No nos hacemos responsables si algo sale mal, si la ubicación no es perfecta o si pasa algún problema.</p>
        <p>La app es gratis. A veces puede mostrar anuncios de gente de aquí. Si no quieres anuncios, hay una opción barata para quitarlos.</p>

        <h2>Cambios</h2>
        <p>Podemos cambiar estas reglas. Si sigues usando la app, significa que estás de acuerdo. Puedes dejar de usarla o borrar tu información cuando quieras.</p>

        <h2>Contacto</h2>
        <p>Si tienes preguntas: WhatsApp +502 3369-5266 (Cabrero App).</p>
      `,
      en: `
        <h2>By using the app you agree to this</h2>
        <p>When you use the Cabrero App (for shepherds) or the DondeCabrero App (for people who want milk), you agree to these simple rules.</p>

        <h2>What the app is for</h2>
        <p>The app helps goat milk shepherds and people who want to buy fresh milk find each other in Guatemala City and nearby. Shepherds can show the path they take while they are selling. People who want milk can see if someone is close by.</p>
        <p>You can use the app without making an account (as a guest) or with your Google or email account.</p>

        <h2>About location</h2>
        <ul>
          <li>We only use your location if you allow it.</li>
          <li>Shepherds choose how much of their path we remember. It disappears after a few days.</li>
          <li>People who want milk can choose whether we show roughly where they are. That information goes away quickly.</li>
          <li>We don’t promise you will always find milk or that the shepherd will be exactly where it says.</li>
        </ul>

        <h2>Important things</h2>
        <p>The app is given “as is”. We do not sell the milk. The purchase is between you and the shepherd. Use it carefully. We are not responsible if something goes wrong, if the location is not perfect, or if any problem happens.</p>
        <p>The app is free. Sometimes it may show ads from local people. If you don’t want ads, there is a cheap option to turn them off.</p>

        <h2>Changes</h2>
        <p>We may change these rules. If you keep using the app, it means you agree. You can stop using it or erase your information anytime.</p>

        <h2>Contact</h2>
        <p>If you have questions: WhatsApp +502 3369-5266 (Cabrero App).</p>
      `
    };
    function updateTerms(lang) {
      lang = lang || localStorage.getItem('dondecabreo-lang') || 'es';
      document.getElementById('terms-title').textContent = lang === 'es' ? 'Términos de Uso' : 'Terms of Use';
      document.getElementById('terms-content').innerHTML = terms[lang];
    }
    window.onLangChange = updateTerms;
    document.addEventListener('DOMContentLoaded', () => updateTerms());
  </script>
</body>
</html>
